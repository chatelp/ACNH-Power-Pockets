name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-checks:
    # Unit tests of the UI model, syntax check of every source file against
    # libnx/SDL2 stubs, and the proof that the inherited save engine is unchanged.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream ACNH-Save-Editor
        run: |
          git remote add upstream https://github.com/cbreezy210/ACNH-Save-Editor.git || true
          git fetch upstream main
      - name: Engine untouched
        run: python3 tools/check_engine_untouched.py upstream/main
      # Pillow lets run.sh compare the app's item-picture rules with tools/make_item_glyphs.py.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow
        run: python3 -m pip install --quiet pillow
        timeout-minutes: 3
      # item_stacks.txt must be exactly what the script makes from the pinned NHSE files.
      - name: Stack limits match NHSE
        run: |
          base=https://raw.githubusercontent.com/kwsch/NHSE/cb0745415945776f73375bf0a434a8babf059307
          for f in NHSE.Core/Structures/Item/ItemKind.cs NHSE.Core/Structures/Item/ItemInfo.cs NHSE.Core/Resources/byte/item_kind.bin; do
            mkdir -p "nhse/$(dirname "$f")" && curl -fsSL "$base/$f" -o "nhse/$f"
          done
          python3 tools/make_item_stacks.py nhse --check
      - name: Host tests
        run: CXX=clang++ sh tests/host/run.sh
      # Real main.cpp on a fake console (synthetic save, injected failures).
      - name: Engine bench
        run: CXX=clang++ sh tests/host/engine_bench.sh

  switch-nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      # The image already ships the Switch portlibs; pkg.devkitpro.org refuses
      # package downloads from CI runners (HTTP 403), so only check they are there.
      - name: Portlibs present
        run: |
          for l in SDL2 SDL2_ttf freetype harfbuzz png16 bz2 z EGL glapi drm_nouveau; do
            ls "$DEVKITPRO/portlibs/switch/lib/lib$l.a" || exit 1
          done
      - name: Build
        run: make -j"$(nproc)"
      - name: Package (SD card layout)
        run: |
          mkdir -p dist/switch/acnh_power_pockets
          cp acnh_power_pockets.nro icon.png dist/switch/acnh_power_pockets/
          cp assets/font.ttf assets/items.txt assets/ui_icons.png assets/nonstackable.txt dist/switch/acnh_power_pockets/
          cp assets/item_glyphs.png assets/item_glyphs.txt assets/item_stacks.txt dist/switch/acnh_power_pockets/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/switch/acnh_power_pockets/
          cp -R licenses dist/switch/acnh_power_pockets/
      - uses: actions/upload-artifact@v4
        with:
          name: acnh-power-pockets
          path: dist/
